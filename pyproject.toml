[project]
name = "adaptive-pinns"
version = "0.1.0"
description = "Implementation code"
readme = "README.md"
authors = [
    { name = "Albert Johannessen", email = "albert.johannessen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "equinox>=0.13.8",
    "jax>=0.11.2",
    "jaxtyping>=0.3.11",
    "matplotlib>=3.11.2",
    "optax>=0.2.8",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
gpu = [
    "jax[cuda13]>=0.11.2",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
ignore = ["E402", "E721", "E731", "E741", "F722"]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM"
]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"
